[project]
name = "sp"
version = "0.1.0"
description = "Sistema de Propuestas - Mercado Publico + IA (backend)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14",
    "structlog>=24.4",
    "cryptography>=43.0",
    "pyjwt[crypto]>=2.9",
    "procrastinate>=2.14",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa Depends(...) (y nuestro require_role(...), que lo envuelve) como default de argumento
# por diseno; B008 asume que es un error, pero aqui es el patron idiomatico de FastAPI.
extend-immutable-calls = ["fastapi.Depends", "sp.api.deps.require_role"]

[tool.mypy]
python_version = "3.13"
packages = ["sp"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sp.modules.scoring.*", "sp.modules.review_excel.*", "sp.modules.analysis.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: pruebas que requieren Postgres real (ver tests/integration)",
    "llm: pruebas manuales contra un proveedor de IA real (fuera de CI)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp"]
